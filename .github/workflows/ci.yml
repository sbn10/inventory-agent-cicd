name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          GEMINI_API_KEY: ci-placeholder
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/sbn10/inventory-agent-cicd:latest .

      - name: Push Docker image
        run: docker push ghcr.io/sbn10/inventory-agent-cicd:latest
      
  deploy:
      needs: test
      runs-on: [self-hosted, inventory-deploy]

      steps:
        - name: Check Docker on Windows
          shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
          run: docker info
        
        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Pull Docker image
          shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
          run: docker pull --platform linux/amd64 ghcr.io/sbn10/inventory-agent-cicd:latest
        
        - name: Deploy Inventory Agent on Windows
          shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
          run: |
            $envFile = "C:\Users\user\Downloads\inventory-from-github\.env"

            if (-not (Test-Path $envFile)) {
              throw "Local .env file not found"
            }

            $existing = docker ps -aq --filter "name=^/inventory-cicd$"

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            if ($existing) {
              docker rm -f inventory-cicd
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }

            docker run -d --platform linux/amd64 --name inventory-cicd `
              -p 127.0.0.1:8000:8000 `
              --env-file $envFile `
              ghcr.io/sbn10/inventory-agent-cicd:latest

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            docker exec inventory-cicd python manage.py migrate
            exit $LASTEXITCODE