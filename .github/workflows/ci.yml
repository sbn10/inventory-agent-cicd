name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          GEMINI_API_KEY: ci-placeholder
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/sbn10/inventory-agent-cicd:latest .

      - name: Push Docker image
        run: docker push ghcr.io/sbn10/inventory-agent-cicd:latest
      
  deploy:
      needs: test
      runs-on: [self-hosted, inventory-deploy]

      steps:
        - name: Check Docker on Windows
          shell: powershell
          run: docker info